<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d8dde6; stroke-width: 2; }
      .soft { fill: #f1f5f9; stroke: #d8dde6; stroke-width: 1.5; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .h2 { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2937; }
      .h3 { font: 700 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111827; }
      .text { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #4b5563; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #64748b; }
      .label { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #2563eb; }
      .button { fill: #2563eb; }
      .buttonText { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .guard { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
      .open { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; }
      .line { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="920"/>
  <text class="title" x="60" y="64">纸箱自动配纸工具 UI 方向</text>
  <text class="text" x="60" y="100">两个核心模块：配纸试算无需登录，数据管理登录后访问，避免原纸价格等内部数据暴露。</text>

  <rect class="panel" x="60" y="140" width="1280" height="90" rx="12"/>
  <text class="h3" x="92" y="194">纸箱自动配纸工具</text>
  <text class="text" x="880" y="194">配纸试算</text>
  <text class="text" x="1000" y="194">数据管理</text>
  <rect class="button" x="1130" y="162" width="150" height="42" rx="6"/>
  <text class="buttonText" x="1171" y="189">登录</text>

  <rect class="panel" x="60" y="270" width="610" height="320" rx="12"/>
  <text class="label" x="100" y="320">公开入口</text>
  <text class="h2" x="100" y="360">单次配纸界面</text>
  <text class="text" x="100" y="402">销售或工艺人员打开即可使用，不需要先登录。</text>
  <rect class="soft" x="100" y="435" width="510" height="92" rx="8"/>
  <text class="text" x="126" y="470">填写纸箱尺寸、产品重量、生产数量、堆码层数</text>
  <text class="small" x="126" y="502">生成经济型、安全型、均衡型三套方案</text>
  <rect class="button" x="100" y="545" width="150" height="44" rx="6"/>
  <text class="buttonText" x="132" y="573">开始配纸</text>
  <rect class="open" x="410" y="545" width="200" height="44" rx="6"/>
  <text class="text" x="437" y="573">无需登录可访问</text>

  <rect class="panel" x="730" y="270" width="610" height="320" rx="12"/>
  <text class="label" x="770" y="320">内部入口</text>
  <text class="h2" x="770" y="360">数据管理界面</text>
  <text class="text" x="770" y="402">维护纸厂、原纸价格、基础参数、导入导出备份。</text>
  <rect class="soft" x="770" y="435" width="510" height="92" rx="8"/>
  <text class="text" x="796" y="470">未登录访问时，只显示登录提示，不展示内部数据</text>
  <text class="small" x="796" y="502">登录后展示原纸列表、价格、参数、导入记录</text>
  <rect class="button" x="770" y="545" width="170" height="44" rx="6"/>
  <text class="buttonText" x="811" y="573">进入管理</text>
  <rect class="guard" x="1020" y="545" width="260" height="44" rx="6"/>
  <text class="text" x="1050" y="573">需要登录，保护内部数据</text>

  <path class="line" d="M 365 620 C 420 670, 470 690, 560 710"/>
  <path class="line" d="M 1030 620 C 980 670, 910 690, 820 710"/>

  <rect class="panel" x="120" y="710" width="1160" height="145" rx="12"/>
  <text class="h2" x="160" y="755">建议导航方式</text>
  <text class="text" x="160" y="795">方案 B：默认直接进入配纸页，顶部保留“数据管理”入口。</text>
  <text class="small" x="160" y="828">理由：配纸是最高频主流程，免登录减少销售试算阻力；数据管理仍通过登录保护内部价格和参数。</text>
  <text class="small" x="160" y="858">如果你更想强调两个模块边界，也可以改成双入口首页。</text>
</svg>
